# Configuration of the Code-Analysis-Tool.
#
# The scheduler reads this file at the start of every run (docker-compose.yml
# mounts it read-only): changes need no rebuild, except the OpenGrep rule sets
# ([opengrep]), which are built into the OpenGrep image.

# ---------------------------------------------------------------------------
# Step 3: OpenGrep rule sets. Definition: docs/staticAnalysis/README.md
#
# OpenGrep ships no rules; it runs the rule sets listed in `active` below.
# Only these active rule sets are downloaded into the image
# code-analysis/opengrep; the other definitions are not downloaded. After
# changing `active`, adding a rule set or changing a commit, rebuild the image:
#   docker compose -f docker/docker-compose.yml --profile tools build opengrep
# (The scheduler stops with this hint if the image doesn't match this file.)
#
# A rule set is a git repository at a fixed commit. `folders` maps each
# language of step 1 (C, C++, C#, Java, JavaScript, TypeScript, Python, Rust)
# to the rule folders of the repository that cover it; languages without an
# entry get no rules from that set. `exclude` lists rule files (relative to the
# repository) that are left out, e.g. because OpenGrep rejects them.
#
# The rules are only stored in the local Docker image, never in this
# repository: some licenses forbid distributing them (semgrep-rules: "This
# license does not allow you to distribute the rules"). Findings and reports
# contain the rules' messages and metadata, so results produced with such
# rules must not be published either (see docs/staticAnalysis/README.md).

[opengrep]
# Active rule sets. To use the OpenGrep fork instead of Semgrep's current
# rules, replace "semgrep-rules" with "opengrep-rules" and rebuild the image.
# Activating semgrep-rules downloads them, which means accepting their license.
active = ["semgrep-rules", "0xdea-semgrep-rules"]

# Fork of semgrep-rules from December 13, 2024 (archived, no further changes).
[opengrep.rulesets.opengrep-rules]
repository = "https://github.com/opengrep/opengrep-rules"
commit = "f1d2b562b414783763fd02a6ed2736eaed622efa"
license = "LGPL-2.1 with Commons Clause"
exclude = []

[opengrep.rulesets.opengrep-rules.folders]
C = ["c"]
"C#" = ["csharp"]
Java = ["java"]
# Most rules in javascript/ cover TypeScript too; typescript/ adds TS-only rules.
JavaScript = ["javascript", "typescript"]
TypeScript = ["javascript", "typescript"]
Python = ["python"]
Rust = ["rust"]

# Semgrep's own rules. License: Semgrep Rules License v1.0
# (semgrep.dev/legal/rules-license): "By using the rules, you agree to all of
# the terms", "You may use the rules only for your own internal business
# purposes", no distribution, no use as a service for others.
[opengrep.rulesets.semgrep-rules]
repository = "https://github.com/semgrep/semgrep-rules"
commit = "a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2"
license = "Semgrep Rules License v1.0"
exclude = []

[opengrep.rulesets.semgrep-rules.folders]
C = ["c"]
"C#" = ["csharp"]
Java = ["java"]
JavaScript = ["javascript", "typescript"]
TypeScript = ["javascript", "typescript"]
Python = ["python"]
Rust = ["rust"]

# C and C++ rules by Marco Ivaldi; every rule covers both languages. Neither
# opengrep-rules nor semgrep-rules has rules for C++ files. The folder noisy/
# is left out.
[opengrep.rulesets.0xdea-semgrep-rules]
repository = "https://github.com/0xdea/semgrep-rules"
commit = "b9942606d3543e3145a95332e6543fb79a01af00"
license = "MIT"
exclude = []

[opengrep.rulesets.0xdea-semgrep-rules.folders]
C = ["rules/c"]
"C++" = ["rules/c"]

# ---------------------------------------------------------------------------
# Step 5: tests. Definition: docs/testAnalysis/README.md

[tests]
# Network for the test runs (also those for coverage and mutation testing).
# Tests execute the project's code. Without network they can reach neither the
# internet nor services in your local network. Only set this to true if you
# trust the project's code. Downloading the dependencies before the tests
# always has network.
network = false

# Time limit of each test run, in minutes. 0 means no limit.
time_limit_minutes = 60

[tests.mutation]
# Mutation testing. "sample": a random sample of the source files the tests
# cover (fixed seed, so the sample is reproducible); "full": every source file
# of the suite. Full runs can take hours to days on large projects.
mode = "sample"
sample_files = 20   # source files per test suite in mode "sample"
seed = 1

# Time limit of each mutation run, in minutes. 0 means no limit. When it is
# reached, the run stops and keeps the results written so far.
time_limit_minutes = 60

# ---------------------------------------------------------------------------
# Step 6: LLM evaluation with Ollama. Definition: docs/LLMAudit/README.md
#
# Two models: a decision model labels each finding (or group of findings), a
# reasoning model writes the reports from these labels. The final audit
# (audit.md, audit.json) is built from the reports by the tool itself. The two
# models are never loaded at the same time: the tool unloads the decision model
# before the reasoning model starts, and that one at the end.
# Every key has a default; a key that is not listed here is an error.

[llm]
base_url = "http://host.docker.internal:11434"  # Ollama's address from the scheduler container; OLLAMA_BASE_URL in docker/.env overrides it
report_language = "English"                       # language of the texts the reasoning model writes; "German" also gives German audit headings
areas = ["security", "code_quality", "test_quality"]  # areas to evaluate; leave one out to skip it

# What the tool prepares for the models (and the excerpts in the reports).
# Smaller values make requests smaller and faster, but the models see less.
[llm.input]
message_chars = 300             # characters of a finding's message (or an advisory's summary) the models see
code_chars = 3000               # characters of the code excerpt around a finding (OWASP Benchmark: the longest excerpt with 30 lines has 2893)
code_context_lines = 30         # lines of code before and after the finding in the excerpt (OWASP Benchmark: 30 lines reach the start of the method in 70 % of the findings; 60 lines (99 %) filled the memory with pplx-decider-flash)
strip_comments = true           # leave comments out of the code the models see (line numbers stay); for benchmarks whose comments tell which code is safe, false for real projects
group_samples = 5               # sample locations per group of findings (code quality and security groups)
group_samples_with_code = 3     # how many of these samples include a code excerpt (at most group_samples)
group_messages = 3              # different messages shown per group
security_single_severity = "high"  # REAL security findings of this severity or higher get a text of their own ("high": also error, critical); the others get one text per rule (or package) and label
failed_tests_per_group = 5      # test names shown per group of failed tests
failure_message_chars = 600     # characters of the failure message of a group of failed tests
declaration_chars = 300         # characters of the declarations (classes, functions) of a weakly tested file
weak_line_rate = 0.5            # source files below this line coverage (0.5 = 50 %) are labeled as weakly tested
diff_example_lines = 10         # lines of the formatter example diff copied into the report
patch_sample_kib = 32           # KiB of changes.patch the reasoning model reads to name the kinds of formatter change

# Decision model, called through Ollama's decision endpoint (/v1/systemone).
# Every finding (or group of findings) is one question; the model chooses one
# label per question and returns the probability of each label. The rules are
# the shared input of a request. Ollama scores every question with its own copy
# of the shared input, so the memory a request needs grows with the number of
# questions: on a Mac with 32 GB, requests with 24 to 32 questions (30 KB) used
# up the memory; requests with 8 questions took about 2 seconds.
[llm.decision]
model = "pplx-decider-flash:latest"  # the decision model; it must be installed (`ollama pull <model>`)
timeout_seconds = 300                # time limit per request, including loading the model
retries = 2                          # repetitions of a failed request with one question (larger requests are split instead)
keep_alive = "10m"                   # how long Ollama keeps the model loaded between requests ("10m", or seconds)
max_questions = 1                    # questions (findings) per request; the endpoint allows at most 64. 1: Perplexity reports a higher Decision Index for pplx-decider-flash with one question per request (60.05 instead of 58.88); more requests
max_input_kib = 20                   # text per request in KiB: the shared input once per question, plus the questions
review_confidence = 0.6              # decisions with a lower confidence are flagged for review in the audit

# Reasoning model, called through Ollama's chat endpoint (/api/chat) with a
# JSON schema for the answer. It needs a build with structured output: GGUF
# (llama.cpp), not MLX, which answers "HTTP 501: structured output is unavailable".
[llm.report]
model = "gpt-oss:20b"   # the reasoning model; it must be installed (`ollama pull <model>`)
timeout_seconds = 900          # time limit per request, including loading the model and its reasoning
retries = 2                    # repetitions of a failed request, and of an answer that is not valid (with another seed)
keep_alive = "10m"             # how long Ollama keeps the model loaded between requests ("10m", or seconds)
think = "medium"             # reasoning before the answer: true, false, or a level of the model, e.g. "low", "medium", "high" (gpt-oss); false on a model that always reasons gives its lowest level
temperature = 1.0              # randomness of the text: 0 = always the most likely token, higher = more varied. gpt-oss: 1.0 as OpenAI recommends
top_p = 1.0                    # only tokens within this cumulative probability are considered. gpt-oss: 1.0 as OpenAI recommends
# top_k = 20                   # only the k most likely tokens are considered; not set: not sent, Ollama's default applies (OpenAI recommends no value for gpt-oss)
# min_p = 0.0                  # tokens below this probability (relative to the most likely one) are left out; not set: the model's default
seed = 42                      # random seed for reproducible answers; a repeated request uses seed + 1, seed + 2, ...
num_ctx = 16384                # context window in tokens: prompt and answer together (more needs more memory)
num_predict = 6144             # maximum tokens per answer, including the reasoning; must be smaller than num_ctx
entries_per_request = 10       # report entries written per request (fewer if they do not fit the context window)
chars_per_token = 2.5          # estimate used to fit entries into num_ctx; lower is safer, higher packs more per request

# Optional: the reasoning model's settings for one area. Every key of
# [llm.report] except model is possible; keys not set here come from [llm.report].
[llm.report.security]
# think = "high"               # e.g. reason more for the security texts

[llm.report.code_quality]
# think = "low"                # e.g. reason less for the code quality texts
# entries_per_request = 15     # e.g. more groups per request

[llm.report.test_quality]
# num_predict = 8192           # e.g. longer answers for the test assessments

# Threat model of the project (before step 2, see README "Threat model"): what an attacker controls and what
# is shipped. The security decisions and reports of step 6 get the confirmed text. A threat model committed to
# the project as .code-analysis/threat-model.md is always used as it is; the settings below only apply when a
# project has no confirmed threat model yet.
[llm.threat_model]
create = "generate"            # "generate": you answer three questions, the reasoning model of [llm.report] drafts it from them and the project's README, SECURITY.md and docs/, you correct and confirm it; "manual": the tool writes a template, you write the threat model yourself and confirm it (no model)
docs_kib = 24                  # KiB of README, SECURITY.md and docs/ the reasoning model reads for the draft (less if num_ctx is smaller); only for "generate"
context_chars = 2500           # characters of the confirmed threat model the security decisions and reports see; longer ones are cut (each decision request repeats it per question: for libgdx up to about 1200 characters cost no extra requests)
