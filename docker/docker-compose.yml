# Code-Analysis-Tool – Docker deployment
#
# Usage (from the repository root):
#   cp docker/.env.example docker/.env      # then set PROJECTS_DIR and OUTPUT_DIR
#   docker compose -f docker/docker-compose.yml --profile tools build   # tool images, once
#   docker compose -f docker/docker-compose.yml up -d --build
#   bin/code-analysis                       # from any terminal, as often as needed
#   docker compose -f docker/docker-compose.yml down
#
# After `up` the scheduler container idles. Each `bin/code-analysis` runs the
# tool inside it via `docker exec`; the container keeps running afterwards.
# `up` also starts the SonarQube server and its database (step 3); its web
# interface is at http://localhost:9000.
# For every linter/formatter run (step 2) and every analysis tool run (step 3),
# the scheduler starts a fresh container from one of the tool images (profile
# "tools") through the Docker socket.

name: code-analysis

services:
  scheduler:
    build:
      context: ..
      dockerfile: docker/scheduler/Dockerfile
    image: code-analysis/scheduler:latest
    # Fixed name: bin/code-analysis addresses the container with it.
    container_name: code-analysis-scheduler
    # Forwards stop signals to the idle process (fast `down`) and reaps the
    # processes started with `docker exec`.
    init: true
    # Files written into the project (formatter step) keep the host user as
    # owner on Linux. Docker Desktop (macOS/Windows) maps ownership itself.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Group of /var/run/docker.sock inside containers: lets the scheduler start
    # the tool containers without running as root. 991 on Docker Desktop; on
    # Linux the group of the socket (`stat -c %g /var/run/docker.sock`).
    group_add:
      - "${DOCKER_SOCKET_GID:-991}"
    environment:
      PROJECTS_DIR: ${PROJECTS_DIR}
      OUTPUT_DIR: ${OUTPUT_DIR}
      HOST_HOME: ${HOME}
      CONFIG_DIR: /app/config
      SONARQUBE_URL: http://sonarqube:9000
      # Without it, step 3 reports SonarQube as failed (see docker/.env.example).
      SONARQUBE_ADMIN_PASSWORD: ${SONARQUBE_ADMIN_PASSWORD:-}
      # Optional (step 4): token for `conan audit` (free registration at audit.conan.io).
      CONAN_AUDIT_TOKEN: ${CONAN_AUDIT_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # Mounted read-write at the same absolute path as on the host, so host
      # paths can be pasted unchanged at the prompt and passed on unchanged to
      # the tool containers.
      - type: bind
        source: ${PROJECTS_DIR:?Set PROJECTS_DIR in docker/.env (see docker/.env.example)}
        target: ${PROJECTS_DIR}
      # Results of each run (step 2 onwards), same path as on the host.
      - type: bind
        source: ${OUTPUT_DIR:?Set OUTPUT_DIR in docker/.env (see docker/.env.example)}
        target: ${OUTPUT_DIR}
        bind:
          create_host_path: true
      # Tool configuration (config/opengrep.toml: OpenGrep's rule sets), read
      # at each run: changes need no rebuild of the scheduler.
      - type: bind
        source: ../config
        target: /app/config
        read_only: true
      # Starts the tool containers. Project code (build scripts, analyzers)
      # only runs in those containers, which do not get the socket.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    extra_hosts:
      # Docker Desktop already provides host.docker.internal; this entry makes
      # it point to the host on Linux as well (used to reach Ollama).
      - "host.docker.internal:host-gateway"
    networks:
      - analysis-net

  # Linter/formatter images (step 2), one per language. Only built, never
  # started by compose: the scheduler runs them per tool call.
  # Definition of the tools: docs/linterConventions/README.md
  lint-cpp:
    profiles: ["tools"]
    build: linters/cpp
    image: code-analysis/lint-cpp:latest
  lint-dotnet:
    profiles: ["tools"]
    build: linters/dotnet
    image: code-analysis/lint-dotnet:latest
  lint-java:
    profiles: ["tools"]
    build: linters/java
    image: code-analysis/lint-java:latest
  lint-node:
    profiles: ["tools"]
    build: linters/node
    image: code-analysis/lint-node:latest
  lint-python:
    profiles: ["tools"]
    build: linters/python
    image: code-analysis/lint-python:latest
  lint-rust:
    profiles: ["tools"]
    build: linters/rust
    image: code-analysis/lint-rust:latest

  # Static analysis (step 3). OpenGrep with the rule sets of
  # config/opengrep.toml built in; rebuild after changing rule set definitions.
  # Definition: docs/staticAnalysis/README.md
  opengrep:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/static-analysis/opengrep/Dockerfile
    image: code-analysis/opengrep:latest

  # SonarQube Community Build (step 3) with the community plugin for C/C++.
  # Keeps running after `up`: the scheduler sends each analysis to it, and the
  # web interface shows the results (only reachable from this machine).
  sonarqube:
    build: static-analysis/sonarqube
    image: code-analysis/sonarqube:latest
    container_name: code-analysis-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?Set SONARQUBE_DB_PASSWORD in docker/.env (see docker/.env.example)}
    volumes:
      # Analyses and history. No volume for extensions/: the plugins come with
      # the image, and a volume would keep old plugins after an update.
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - analysis-net

  # Database of SonarQube. The embedded H2 database is "recommended for tests
  # but not for production use" (SonarQube documentation).
  sonarqube-db:
    image: postgres:18.6
    container_name: code-analysis-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?Set SONARQUBE_DB_PASSWORD in docker/.env (see docker/.env.example)}
      POSTGRES_DB: sonar
    volumes:
      - sonarqube-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - analysis-net

  # SonarQube scanners (step 3), started by the scheduler per analysis.
  sonar-scanner:
    profiles: ["tools"]
    build: static-analysis/sonar-scanner
    image: code-analysis/sonar-scanner:latest
  sonar-dotnet:
    profiles: ["tools"]
    build: static-analysis/sonar-dotnet
    image: code-analysis/sonar-dotnet:latest

  # Dependency checks (step 4). OSV-Scanner (official image, pinned) and the
  # Python package manager tools; the other ecosystems use the images of
  # step 2 (npm/Yarn/pnpm/Bun, cargo-audit, dotnet, Conan) and sonar-scanner
  # (Gradle). Definition: docs/dependencyAudit/README.md
  osv-scanner:
    profiles: ["tools"]
    build: dependencies/osv-scanner
    image: code-analysis/osv-scanner:latest
  audit-python:
    profiles: ["tools"]
    build: dependencies/python
    image: code-analysis/audit-python:latest

volumes:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-db:

networks:
  # Shared network for the scheduler and the analysis tool containers
  # (OpenGrep, SonarQube, OSV-Scanner, ...) added in later steps.
  analysis-net:
    name: code-analysis-net
    driver: bridge
