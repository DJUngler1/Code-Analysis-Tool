[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analysis-scheduler"
version = "0.1.0"
description = "Scheduler of the Code-Analysis-Tool: orchestrates the analysis steps."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
code-analysis = "scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The prompts of step 6 are read at run time (importlib.resources).
[tool.setuptools.package-data]
"scheduler.evaluation" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs Docker and the tool images; run with `pytest -m docker`",
    "llm: needs Ollama with the models of code-analysis.toml; run with `pytest -m llm`",
]
addopts = "-m 'not docker and not llm'"
